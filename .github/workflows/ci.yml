name: CloudFleet CI/CD & AWS Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test CloudFleet Workspaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check & Build Backend
        run: npm run build --workspace=backend

      - name: Type Check & Build Frontend
        run: npm run build --workspace=frontend

      - name: Type Check & Build Simulator
        run: npm run build --workspace=simulator

      - name: Run Backend Unit & Integration Tests
        run: npm test --workspace=backend

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Validate Terraform Configuration
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  deploy-to-aws:
    name: Deploy to Real AWS via Terraform
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Backend Distribution
        run: |
          npm ci || npm install
          npm run build --workspace=backend

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Check AWS Credentials
        id: check-creds
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning ::AWS Credentials (AWS_ACCESS_KEY_ID & AWS_SECRET_ACCESS_KEY) are not set in GitHub Secrets. Skipping live AWS deployment."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init & Apply
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
          echo "============================================="
          echo "LIVE AWS DEPLOYMENT SUCCESSFUL!"
          echo "============================================="
          terraform output
